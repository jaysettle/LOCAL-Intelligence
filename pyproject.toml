[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "local-intelligence"
version = "0.7.1"
description = "LOCAL-Intelligence — a fully local, offline command-line AI agent with real filesystem, shell, document-reading, web-search and vision tools, powered by Ollama + Gemma."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jay Settle" }]
dependencies = [
    "requests>=2.28",
    "rich>=13.0",
    "pyyaml>=6.0",
    "send2trash>=1.8",
    "pillow>=9.0",
    "prompt_toolkit>=3.0",
    "psutil>=5.9",
    # Document extraction (read_document). All MIT/BSD, pure Python or prebuilt
    # wheels — deliberately not markitdown, whose base install pulls onnxruntime.
    "pypdf>=4.0",
    "python-docx>=1.0",
    "openpyxl>=3.1",
    "python-pptx>=0.6.21",
    "striprtf>=0.0.26",
    "xlrd>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
gemma = "gemma_cli.main:main"

[tool.setuptools.packages.find]
include = ["gemma_cli*"]
